<text x="796" y="1530" class="when">Use a mixed model when:</text>
<text x="796" y="1554" class="when2">• the same people are measured repeatedly</text>

<text x="796" y="1617" class="when2">• you have continuous predictors, or several</text>
<text x="796" y="1638" class="when2">   predictors, in a repeated or clustered design</text>
<text x="796" y="1665" class="when2" font-style="italic">It also works for every row above, so it is the</text>
<text x="796" y="1686" class="when2" font-style="italic">general-purpose option for repeated designs.</text>
